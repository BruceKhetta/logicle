name: Build and publish MCP file analyzer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Analyzer version tag (e.g. 1.0.0); use a new version for changed contents'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: file-analyzer-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BruceKhetta/logicle' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate tags in the Logicle GHCR package
        id: resolve
        env:
          ANALYZER_VERSION: ${{ inputs.version }}
        run: node .github/scripts/file-analyzer-image.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify analyzer source and runtime packaging
        run: |
          node --test .github/scripts/file-analyzer-image.test.mjs packages/file-analyzer/scripts/stage-runtime.test.mjs
          pnpm run check-types
          # Invoke Vitest directly: forwarding "--" through pnpm test makes
          # Vitest ignore the path filter and collect the full application suite.
          pnpm exec vitest run packages/file-analyzer/__tests__

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, verify, and push analyzer (amd64 and arm64)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/file-analyzer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.resolve.outputs.version_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Logicle MCP file analyzer
          cache-from: type=gha,scope=file-analyzer
          cache-to: type=gha,mode=min,scope=file-analyzer
