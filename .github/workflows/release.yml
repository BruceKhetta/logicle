name: Publish fork image (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.repository == 'BruceKhetta/logicle'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve registry path
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fork image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=min,scope=docker-build
          build-args: APP_VERSION=${{ inputs.tag }}
