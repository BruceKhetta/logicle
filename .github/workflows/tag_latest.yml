name: Promote fork image to latest (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published image tag (e.g. 1.0.1)'
        required: true
        type: string

concurrency:
  group: fork-image-latest
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'BruceKhetta/logicle'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Resolve registry path
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote GHCR image to latest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
